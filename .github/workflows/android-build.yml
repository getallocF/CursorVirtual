name: Build PaperDollTouch Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "PaperDollTouch-source.zip"
      - "PaperDollTouch-source-fixed.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip

      - name: Extract source ZIP
        run: |
          mkdir -p source
          if [ -f PaperDollTouch-source-fixed.zip ]; then
            SOURCE_ZIP=PaperDollTouch-source-fixed.zip
          elif [ -f PaperDollTouch-source.zip ]; then
            SOURCE_ZIP=PaperDollTouch-source.zip
          else
            echo "No PaperDollTouch source ZIP found" >&2
            exit 2
          fi
          echo "Building source from $SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d source
          test -f source/PaperDollTouch-project/CMakeLists.txt

      - name: Run portable cursor-core tests
        run: |
          cmake -S source/PaperDollTouch-project -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure Android ARM64 build
        run: |
          cmake -S source/PaperDollTouch-project \
            -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOD_ID=PaperDollTouch \
            '-DMOD_NAME=PaperDollTouch (Experimental Cursor Core)' \
            -DMOD_AUTHOR=PaperDollTouch \
            -DMOD_VERSION=0.2.0 \
            -DMOD_LIBRARY_NAME=PaperDollTouch \
            '-DMOD_MINECRAFT_VERSIONS=["1.26.60*"]'

      - name: Compile and package
        run: |
          cmake --build build-android --target levi_package --parallel 2
          test -f build-android/libPaperDollTouch.so
          test -f build-android/PaperDollTouch-0.2.0-arm64-v8a.levipack
          unzip -p build-android/PaperDollTouch-0.2.0-arm64-v8a.levipack PaperDollTouch/manifest.json | tee build-android/packaged-manifest.json
          grep -F '"1.26.60*"' build-android/packaged-manifest.json

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PaperDollTouch-Android-ARM64
          path: |
            build-android/PaperDollTouch-0.2.0-arm64-v8a.levipack
            build-android/libPaperDollTouch.so
            build-android/packaged-manifest.json
          if-no-files-found: error
